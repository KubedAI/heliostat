{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "heliostat.serviceAccountName" . }}
  labels:
    {{- include "heliostat.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "heliostat.fullname" . }}-reader
  labels:
    {{- include "heliostat.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters", "rayservices"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.rbac.serviceProxy }}
  # Reach Ray head dashboards and the History Server through the API server.
  # `get` only: the API server rejects proxied POST, PUT, and DELETE.
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "heliostat.fullname" . }}-reader
  labels:
    {{- include "heliostat.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "heliostat.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "heliostat.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
