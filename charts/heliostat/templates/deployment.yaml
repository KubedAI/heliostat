{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: job history is stored in SQLite on a ReadWriteOnce volume." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heliostat.fullname" . }}
  labels:
    {{- include "heliostat.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The ReadWriteOnce volume cannot attach to two nodes at once; never run old and new pods together.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "heliostat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heliostat.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "heliostat.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "heliostat.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: heliostat
          image: {{ include "heliostat.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: HELIOSTAT_CONFIG
              value: /etc/heliostat/config.yaml
            - name: HELIOSTAT_MODELS_PATH
              value: /etc/heliostat/models.yaml
            - name: HELIOSTAT_DB_PATH
              value: /var/lib/heliostat/heliostat.db
            - name: HELIOSTAT_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: { path: /api/livez, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/livez, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/heliostat
            - name: config
              mountPath: /etc/heliostat
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "heliostat.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "heliostat.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
