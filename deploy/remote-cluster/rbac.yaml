# Read-only access for a Heliostat hub running in another cluster or AWS account.
#
# Apply to each remote cluster, then map the hub's IAM role to the `heliostat:readers` group with
# an EKS access entry (see docs/CLUSTERS.md):
#
#   aws eks create-access-entry --cluster-name <remote> \
#     --principal-arn arn:aws:iam::<remote-account>:role/heliostat-reader \
#     --kubernetes-groups heliostat:readers
#
# Two grants with different scopes:
#   1. Ray resources, cluster-wide. Heliostat watches RayJobs, RayClusters, and RayServices in every
#      namespace, so this binding must be a ClusterRoleBinding.
#   2. The API server service proxy, per namespace. `get services/proxy` reaches any Service in its
#      scope, including internal UIs that are not Ray. Bind it only in namespaces that run Ray
#      clusters (and the History Server's namespace, if the remote cluster has one). Copy the
#      RoleBinding at the end of this file for each namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heliostat-remote-reader
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters", "rayservices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heliostat-remote-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: heliostat-remote-reader
subjects:
  - kind: Group
    name: heliostat:readers
    apiGroup: rbac.authorization.k8s.io
---
# Ray head dashboards and the History Server through the API server proxy.
# `get` only: the API server rejects proxied POST, PUT, and DELETE.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heliostat-remote-dashboard-proxy
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heliostat-remote-dashboard-proxy
  namespace: raydata # one RoleBinding per namespace that runs Ray clusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: heliostat-remote-dashboard-proxy
subjects:
  - kind: Group
    name: heliostat:readers
    apiGroup: rbac.authorization.k8s.io
