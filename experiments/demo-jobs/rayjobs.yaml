apiVersion: v1
kind: List
items:
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-summarize-01
      namespace: raydata
      labels: { heliostat.io/demo: "true", heliostat.io/model-id: gemma-4-12b-it, heliostat.io/owner: research, heliostat.io/workload-type: native-batch }
    spec: &jobSpec
      entrypoint: python -c "import time; print('summarizing 120 records'); time.sleep(12); print('complete')"
      shutdownAfterJobFinishes: true
      ttlSecondsAfterFinished: 86400
      submitterPodTemplate:
        spec:
          serviceAccountName: raydata
          restartPolicy: Never
          containers: [{ name: ray-job-submitter, image: "rayproject/ray:2.56.0-py312" }]
      rayClusterSpec:
        rayVersion: "2.56.0"
        headGroupSpec:
          rayStartParams: { num-cpus: "1" }
          template:
            spec:
              serviceAccountName: raydata
              containers:
                - name: ray-head
                  image: "rayproject/ray:2.56.0-py312"
                  resources:
                    requests: { cpu: 250m, memory: 1Gi }
                    limits: { memory: 2Gi }
              nodeSelector: { kubernetes.io/arch: amd64 }
        workerGroupSpecs: []
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-extract-02
      namespace: raydata
      labels: { heliostat.io/demo: "true", heliostat.io/model-id: qwen-2-5-32b-instruct, heliostat.io/owner: document-ai, heliostat.io/workload-type: endpoint-batch }
    spec:
      <<: *jobSpec
      entrypoint: python -c "import time; print('extracting structured fields'); time.sleep(18); print('complete')"
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-classify-03
      namespace: raydata
      labels: { heliostat.io/demo: "true", heliostat.io/model-id: deepseek-r1-distill-qwen-8b, heliostat.io/owner: trust-safety, heliostat.io/workload-type: native-batch }
    spec:
      <<: *jobSpec
      entrypoint: python -c "import time; print('classifying tickets'); time.sleep(22); print('complete')"
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-enrich-04
      namespace: raydata
      labels: { heliostat.io/demo: "true", heliostat.io/model-id: gemma-4-12b-it, heliostat.io/owner: data-platform, heliostat.io/workload-type: endpoint-batch }
    spec:
      <<: *jobSpec
      entrypoint: python -c "import time; print('enriching product catalog'); time.sleep(30); print('complete')"
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-evaluate-05
      namespace: raydata
      labels: { heliostat.io/demo: "true", heliostat.io/model-id: qwen-2-5-32b-instruct, heliostat.io/owner: model-quality, heliostat.io/workload-type: native-batch }
    spec:
      <<: *jobSpec
      entrypoint: python -c "import time; print('running evaluation set'); time.sleep(45); print('complete')"
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-backfill-06
      namespace: raydata
      labels: { heliostat.io/demo: "true", heliostat.io/model-id: deepseek-r1-distill-qwen-8b, heliostat.io/owner: analytics, heliostat.io/workload-type: endpoint-batch }
    spec:
      <<: *jobSpec
      entrypoint: python -c "import time; print('backfill started'); time.sleep(300); print('complete')"
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-invalid-input-07
      namespace: raydata
      labels: { heliostat.io/demo: "true", heliostat.io/model-id: gemma-4-12b-it, heliostat.io/owner: research, heliostat.io/workload-type: native-batch }
    spec:
      <<: *jobSpec
      entrypoint: python -c "import sys; print('input schema validation failed'); sys.exit(1)"
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-capacity-test-08
      namespace: raydata
      labels: { heliostat.io/demo: "true", heliostat.io/model-id: qwen-2-5-32b-instruct, heliostat.io/owner: platform-ai, heliostat.io/workload-type: native-batch }
    spec:
      <<: *jobSpec
      entrypoint: python -c "import time; print('capacity test'); time.sleep(75); print('complete')"
