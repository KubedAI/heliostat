apiVersion: v1
kind: List
items:
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-lifecycle-short
      namespace: raydata
      labels:
        heliostat.io/test: lifecycle
        heliostat.io/model-id: gemma-4-12b-it
        heliostat.io/owner: platform-validation
        heliostat.io/workload-type: native-batch
      annotations:
        heliostat.io/input-tokens: "12000"
        heliostat.io/output-tokens: "2800"
        heliostat.io/total-tokens: "14800"
        heliostat.io/estimated-cost-usd: "0.019"
    spec: &lifecycleJob
      entrypoint: python -c "import time; print('short batch started', flush=True); time.sleep(120); print('short batch complete', flush=True)"
      shutdownAfterJobFinishes: true
      ttlSecondsAfterFinished: 86400
      submitterPodTemplate:
        spec:
          serviceAccountName: raydata
          restartPolicy: Never
          containers:
            - name: ray-job-submitter
              image: rayproject/ray:2.56.0-py312
      rayClusterSpec:
        rayVersion: "2.56.0"
        headGroupSpec:
          rayStartParams: { num-cpus: "1" }
          template:
            spec:
              serviceAccountName: raydata
              containers:
                - name: ray-head
                  image: rayproject/ray:2.56.0-py312
                  resources:
                    requests: { cpu: 250m, memory: 1Gi }
                    limits: { memory: 2Gi }
              nodeSelector: { kubernetes.io/arch: amd64 }
        workerGroupSpecs: []
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-lifecycle-long
      namespace: raydata
      labels:
        heliostat.io/test: lifecycle
        heliostat.io/model-id: qwen-2-5-32b-instruct
        heliostat.io/owner: platform-validation
        heliostat.io/workload-type: endpoint-batch
      annotations:
        heliostat.io/input-tokens: "45000"
        heliostat.io/output-tokens: "9100"
        heliostat.io/total-tokens: "54100"
        heliostat.io/estimated-cost-usd: "0.071"
    spec:
      <<: *lifecycleJob
      entrypoint: python -c "import time; print('long batch started', flush=True); time.sleep(240); print('long batch complete', flush=True)"
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-lifecycle-failure
      namespace: raydata
      labels:
        heliostat.io/test: lifecycle
        heliostat.io/model-id: deepseek-r1-distill-qwen-8b
        heliostat.io/owner: platform-validation
        heliostat.io/workload-type: native-batch
      annotations:
        heliostat.io/input-tokens: "7300"
        heliostat.io/output-tokens: "0"
        heliostat.io/total-tokens: "7300"
        heliostat.io/estimated-cost-usd: "0.008"
    spec:
      <<: *lifecycleJob
      entrypoint: python -c "import time,sys; print('failure-path batch started', flush=True); time.sleep(60); print('controlled validation failure', flush=True); sys.exit(1)"
  - apiVersion: ray.io/v1
    kind: RayJob
    metadata:
      name: heliostat-running-observer
      namespace: raydata
      labels:
        heliostat.io/test: lifecycle
        heliostat.io/model-id: gemma-4-12b-it
        heliostat.io/owner: platform-validation
        heliostat.io/workload-type: native-batch
      annotations:
        heliostat.io/input-tokens: "0"
        heliostat.io/output-tokens: "0"
        heliostat.io/total-tokens: "0"
        heliostat.io/estimated-cost-usd: "0"
    spec:
      <<: *lifecycleJob
      entrypoint: python -c "import time; print('observable running job started', flush=True); time.sleep(600); print('observable running job complete', flush=True)"
